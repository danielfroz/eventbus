name: Publish
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docker-compose.yml'
      - 'test.sh'
      - '.gitignore'
      - '.claude/**'
      - '.vscode/**'
      - 'examples/**'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish package
        run: npx jsr publish
